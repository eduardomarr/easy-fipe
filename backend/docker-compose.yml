services:
  postgres:
    image: postgres:16-alpine
    container_name: easy-fipe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easy_fipe
    ports:
      - "54322:5432"
    volumes:
      - easy_fipe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  easy_fipe_pg_data:
